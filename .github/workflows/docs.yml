name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '**/*.rst'
      - '**/*.md'
      - 'pyproject.toml'
      - '.readthedocs.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - '**/*.rst'
      - '**/*.md'
      - 'pyproject.toml'
      - '.readthedocs.yaml'

jobs:
  docs:
    runs-on: ubuntu-24.04
    permissions:
      contents: read         # for actions/checkout
      pull-requests: write   # for the "Comment PR with documentation preview" step
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Cache UV dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install SWI-Prolog
        run: |
          sudo apt-add-repository ppa:swi-prolog/stable
          sudo apt-get update
          sudo apt-get install -y swi-prolog
          swipl --version
          swipl -g "current_prolog_flag(home, Home), writeln(Home)" -t halt
          swipl -g "current_prolog_flag(executable, Exe), writeln(Exe)" -t halt

      - name: Set up SWI-Prolog environment
        run: |
          SWIPL_HOME=$(swipl -g "current_prolog_flag(home, Home), writeln(Home)" -t halt)
          echo "SWI_HOME_DIR=$SWIPL_HOME" >> $GITHUB_ENV
          ARCH=$(uname -m)
          echo "LD_LIBRARY_PATH=$SWIPL_HOME/lib/$ARCH-linux:$LD_LIBRARY_PATH" >> $GITHUB_ENV
          echo "SWI-Prolog environment:"
          echo "SWI_HOME_DIR: $SWIPL_HOME"
          echo "LD_LIBRARY_PATH: $LD_LIBRARY_PATH"

      - name: Install Dependencies
        run: |
          uv sync --group docs

      - name: Check Documentation Quality
        run: |
          cd docs
          uv run doc8 . || echo "Documentation quality check found issues"
          uv run make linkcheck || echo "Link check found broken links"
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          SPHINX_BUILD: "True"

      - name: Build Documentation
        run: |
          rm -rf docs/_build/html
          cd docs
          uv run make SPHINXOPTS="-v" html
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          SPHINX_DEBUG: 1
          SPHINX_BUILD: "True"

      - name: Check Build Output
        if: always()
        run: |
          echo "Checking docs build directory..."
          if [ ! -d "docs/_build/html" ]; then
            echo "Documentation build failed - _build/html directory missing"
            exit 1
          fi
          ls -la docs/_build/html
          if [ -f "docs/_build/html/index.html" ]; then
            echo "Documentation built successfully"
          else
            echo "Documentation build failed - no index.html"
            exit 1
          fi

      - name: Upload Documentation Artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: docs/_build/html/
          compression-level: 0

      - name: Comment PR with documentation preview
        if: github.event_name == 'pull_request' && success()
        continue-on-error: true   # PRs from forks always get a read-only token; never fail the docs check over a cosmetic comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const artifactUrl = 'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}';
            const body = '📚 Documentation preview is available! [Download the artifact](' + artifactUrl + ') and view locally.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
