name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:

  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag is on main branch
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! git branch -r --contains "$TAG_NAME" | grep -q 'origin/main'; then
            echo "::error::Tag $TAG_NAME is not on the main branch. Releases must be tagged from main."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install UV
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Cache UV dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/uv.lock', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Determine release type and latest status
        id: release-info
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION=${TAG_NAME#v}

          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Determine if this should be marked as latest
          # Latest = stable releases (x.y.z) and post releases (x.y.z.postN)
          if [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.(post)[0-9]+)?$ ]]; then
            echo "is_latest=true" >> $GITHUB_OUTPUT
            echo "release_type=release" >> $GITHUB_OUTPUT
            echo "📦 Stable release - will be marked as latest"
          elif [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+[-\.]?(a|alpha|b|beta|rc)[0-9]*$ ]]; then
            echo "is_latest=false" >> $GITHUB_OUTPUT
            echo "release_type=prerelease" >> $GITHUB_OUTPUT
            echo "🧪 Pre-release - will NOT be marked as latest"
          elif [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+[-\.]?(dev)[0-9]*$ ]]; then
            echo "is_latest=false" >> $GITHUB_OUTPUT
            echo "release_type=dev" >> $GITHUB_OUTPUT
            echo "🚧 Development release - will NOT be marked as latest"
          else
            echo "is_latest=false" >> $GITHUB_OUTPUT
            echo "release_type=draft" >> $GITHUB_OUTPUT
            echo "📝 Draft release - will NOT be marked as latest"
          fi

      - name: Prepare release notes
        id: release-notes
        env:
          VERSION: ${{ steps.release-info.outputs.version }}
          TAG_NAME: ${{ steps.release-info.outputs.tag_name }}
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "$TAG_NAME")

          if [ -s RELEASE_NOTES.md ] && git diff-tree --root --no-commit-id --name-only -r "$TAG_COMMIT" | grep -qx 'RELEASE_NOTES.md'; then
            echo "Using RELEASE_NOTES.md changed in tagged commit $TAG_COMMIT"
          elif [ -s CHANGELOG.md ]; then
            echo "RELEASE_NOTES.md not changed in tagged commit; extracting CHANGELOG.md entry for $VERSION..."
            awk -v version="$VERSION" '
              BEGIN {
                escaped = version
                gsub(/\./, "\\.", escaped)
              }
              /^## / {
                if (seen) exit
                if ($0 ~ "^## \\[?" escaped "\\]?([[:space:]]|-|$)") seen = 1
              }
              seen { print }
            ' CHANGELOG.md > RELEASE_NOTES.md
          fi

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Warning: Could not prepare release notes for $TAG_NAME"
            echo "Creating simple release notes..."
            echo "## Release $TAG_NAME" > RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "See CHANGELOG.md for details." >> RELEASE_NOTES.md
          fi

          echo "Release notes content:"
          cat RELEASE_NOTES.md

      - name: Build package
        run: ./run.sh build

      # Always test on TestPyPI first
      - name: Test PyPI release
        env:
          TEST_PYPI_TOKEN: ${{ secrets.TEST_PYPI_TOKEN }}
        run: ./run.sh publish:test:strict

      - name: Test installation from TestPyPI
        env:
          VERSION: ${{ steps.release-info.outputs.version }}
        run: |
          # Create test environment
          python -m venv test_env
          source test_env/bin/activate

          # Install SWI-Prolog
          sudo apt-add-repository ppa:swi-prolog/stable
          sudo apt-get update
          sudo apt-get install -y swi-prolog

          # Set up SWI-Prolog environment
          SWIPL_HOME=$(swipl -g "current_prolog_flag(home, Home), writeln(Home)" -t halt)
          echo "SWI_HOME_DIR=$SWIPL_HOME" >> $GITHUB_ENV
          ARCH=$(uname -m)
          echo "LD_LIBRARY_PATH=$SWIPL_HOME/lib/$ARCH-linux:$LD_LIBRARY_PATH" >> $GITHUB_ENV

          # Install package from TestPyPI (pin exact version to avoid picking up older TestPyPI uploads)
          pip install "langchain>=1.3.9"
          pip install --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple \
              "langchain-prolog==$VERSION"

          # Set up Python environment
          SITE_PACKAGES=$(python -c "import site; print(site.getsitepackages()[0])")
          export PYTHONPATH="${SITE_PACKAGES}:${PYTHONPATH:-}"

          # Test import and version
          EXPECTED_VERSION="$VERSION"
          INSTALLED_VERSION=$(python -c "import langchain_prolog; print(langchain_prolog.__version__)")
          echo "Installed version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Version mismatch! Expected $EXPECTED_VERSION but got $INSTALLED_VERSION"
            exit 1
          fi
          echo "Version check passed: $INSTALLED_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: RELEASE_NOTES.md
          # Key improvement: Control latest tag assignment
          make_latest: ${{ steps.release-info.outputs.is_latest }}
          prerelease: ${{ steps.release-info.outputs.release_type == 'prerelease' || steps.release-info.outputs.release_type == 'dev' }}
          draft: ${{ steps.release-info.outputs.release_type == 'draft' }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Only publish stable releases to PyPI
      - name: Publish to PyPI
        if: steps.release-info.outputs.release_type == 'release'
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: ./run.sh publish:strict

      # Update ReadTheDocs for all tagged versions
      # Note: Set RTD default version to "stable" in project settings for best UX
      - name: Update ReadTheDocs
        id: update-rtd
        env:
          TAG_NAME: ${{ steps.release-info.outputs.tag_name }}
        run: |
          RTD_PROJECT="langchain-prolog"

          echo "Syncing ReadTheDocs versions..."
          SYNC_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Token ${{ secrets.RTD_TOKEN }}" \
            -H "Content-Type: application/json" \
            "https://readthedocs.org/api/v3/projects/$RTD_PROJECT/sync/")
          if [[ ! "$SYNC_RESPONSE" =~ ^2 ]]; then
            echo "::warning::Failed to sync ReadTheDocs versions (HTTP $SYNC_RESPONSE)"
            exit 1
          fi

          echo "Waiting for sync to complete..."
          sleep 20

          echo "Activating version $TAG_NAME via API..."
          for i in 1 2 3 4 5; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
              -H "Authorization: Token ${{ secrets.RTD_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"active": true}' \
              "https://readthedocs.org/api/v3/projects/$RTD_PROJECT/versions/$TAG_NAME/")
            if [[ "$RESPONSE" =~ ^2 ]]; then
              echo "Successfully activated version $TAG_NAME"
              break
            fi
            echo "Attempt $i: RTD returned HTTP $RESPONSE, retrying in 15s..."
            sleep 15
          done
          if [[ ! "$RESPONSE" =~ ^2 ]]; then
            echo "::warning::Failed to activate $TAG_NAME after 5 attempts (last HTTP $RESPONSE)"
            exit 1
          fi

          for RTD_VERSION in "$TAG_NAME" latest; do
            echo "Triggering ReadTheDocs build for $RTD_VERSION..."
            BUILD_RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: Token ${{ secrets.RTD_TOKEN }}" \
              -H "Content-Type: application/json" \
              "https://readthedocs.org/api/v3/projects/$RTD_PROJECT/versions/$RTD_VERSION/builds/")
            if [[ ! "$BUILD_RESPONSE" =~ ^2 ]]; then
              echo "::warning::Failed to trigger ReadTheDocs build for $RTD_VERSION (HTTP $BUILD_RESPONSE)"
              exit 1
            fi
          done
        continue-on-error: true

      - name: Release Summary
        env:
          VERSION: ${{ steps.release-info.outputs.version }}
          TAG_NAME: ${{ steps.release-info.outputs.tag_name }}
          RELEASE_TYPE: ${{ steps.release-info.outputs.release_type }}
          IS_LATEST: ${{ steps.release-info.outputs.is_latest }}
          RTD_OUTCOME: ${{ steps.update-rtd.outcome }}
        run: |
          echo "## 🚀 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: $RELEASE_TYPE" >> $GITHUB_STEP_SUMMARY
          echo "- **Latest**: $IS_LATEST" >> $GITHUB_STEP_SUMMARY
          if [[ "$RTD_OUTCOME" == "success" ]]; then
            echo "- **ReadTheDocs**: ✅ Synced and triggered $TAG_NAME + latest builds" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **ReadTheDocs**: ⚠️ Update attempted; check workflow warnings" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "$RELEASE_TYPE" == "release" ]]; then
            echo "- **PyPI**: ✅ Published" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **PyPI**: ⏭️ Skipped (not a stable release)" >> $GITHUB_STEP_SUMMARY
          fi
